version: 2

models:
  - name: stg_orders
    description: One row per order event, deduplicated by event_id.
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: quantity
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
      - name: total_amount
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: order_status
        tests:
          - accepted_values:
              values: ['completed', 'cancelled']

  - name: stg_products
    description: Latest snapshot of the product catalog.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: unit_price
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false

  - name: stg_customers
    description: Latest snapshot of the customer catalog.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [not_null]