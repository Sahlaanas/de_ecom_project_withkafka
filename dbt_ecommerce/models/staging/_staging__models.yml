version: 2

models:
  - name: stg_orders
    description: "One row per order line item, cleaned and deduplicated from raw purchase events."
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: quantity
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1

  - name: stg_customers
    description: "One row per customer, latest known attributes."
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: stg_products
    description: "One row per product, latest known attributes."
    columns:
      - name: product_id
        tests: [unique, not_null]
